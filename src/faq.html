<!doctype html>
<html lang="{{htmlLang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{faqPageTitle}}</title>
  <meta name="description" content="{{faqPageDescription}}">
  <meta name="theme-color" content="#13213F">
  <link rel="icon" type="image/webp" href="/assets/pegcanvas-logo-160.webp">
  <link rel="canonical" href="https://pegcanvas.com/{{locale}}/faq/">
  <link rel="alternate" hreflang="zh-Hant" href="https://pegcanvas.com/zh/faq/">
  <link rel="alternate" hreflang="en" href="https://pegcanvas.com/en/faq/">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;display=swap">
  <link rel="stylesheet" href="/site.css">
  <script src="/language.js"></script>
</head>
<body>
  <a class="skip" href="#main">{{skip}}</a>

  <header class="topbar">
    <nav class="wrap nav" aria-label="{{navigation}}">
      <a class="brand" href="/{{locale}}/" aria-label="{{home}}">
        <img src="/assets/art-panel-concept-480.webp" width="40" height="40" alt="">
        <span>Peg<span class="brand-accent">Canvas</span></span>
      </a>
      <div class="nav-links">
        <span class="language-links" role="group" aria-label="{{languageLabel}}"><a class="navlink" href="/zh/faq/" lang="zh-Hant" hreflang="zh-Hant"{{zhCurrent}}>中文</a><a class="navlink" href="/en/faq/" lang="en" hreflang="en"{{enCurrent}}>EN</a></span>
        <a class="btn btn-primary btn-sm" href="https://app.pegcanvas.com/">{{startDesign}}</a>
      </div>
    </nav>
  </header>

  <main id="main" class="legal faq-page">
    <div class="wrap legal-wrap">
      <p class="eyebrow">FAQ</p>
      <h1>{{faqHeading}}</h1>
      <p class="small">{{faqIntro}}</p>
      <nav class="legal-toc" aria-label="{{faqHeading}}">{{faqToc}}</nav>
      {{faqBody}}
    </div>
  </main>

  <footer class="footer">
    <div class="wrap footer-inner">
      <p>© 2026 PegCanvas · {{ownership}}</p>
      <p class="footer-links"><a href="/{{locale}}/faq/">{{faqLink}}</a><a href="/{{locale}}/legal/#privacy">{{privacyLink}}</a><a href="/{{locale}}/legal/#copyright">{{copyrightLink}}</a><a href="/{{locale}}/faq/#support" data-pegcanvas-chat>{{support}}</a></p>
    </div>
  </footer>
  <script src="/chat-widget.js" defer></script>
</body>
</html>
